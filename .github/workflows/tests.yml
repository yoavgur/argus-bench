name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: "3.9", openai: "1.30.5"}
          - {python: "3.12", openai: "1.109.1"}
          - {python: "3.12", openai: "2.30.0"}
          - {python: "3.12", openai: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e . pytest httpx "openai${{ matrix.openai && format('=={0}', matrix.openai) || '' }}"
      - run: pytest -q tests
